[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baranet"
version = "0.1.0"
description = "BARA-Net: temporal multispectral burned-area segmentation (TS-SatFire)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baranet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
